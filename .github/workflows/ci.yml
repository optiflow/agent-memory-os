name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Repo gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local gate
        run: pnpm run ci
